name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version for testing (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0-test'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-cuda12
            os: ubuntu-22.04
            cuda: true
            cuda_version: '12.4.1'
            cmake_flags: >-
              -DGGML_CUDA=ON
              -DCMAKE_CUDA_ARCHITECTURES="89;90;120"
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_RPATH='$ORIGIN/lib:$ORIGIN'
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          - target: linux-x86_64-cpu
            os: ubuntu-22.04
            cuda: false
            cmake_flags: >-
              -DGGML_AVX2=ON
              -DGGML_FMA=ON
              -DGGML_VNNI=ON
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_INSTALL_RPATH='$ORIGIN/lib:$ORIGIN'
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2.0-dev"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build patchelf liburing-dev libssl-dev

      - name: Setup CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ matrix.cuda_version }}
          method: 'network'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            ${{ matrix.cmake_flags }}

      - name: Compile Standalone Binaries (llama-cli & llama-server)
        run: |
          cmake --build build --target llama-cli llama-server -j $(nproc)

      - name: Assemble Release Package & Bundle Libraries
        run: |
          TARGET="${{ matrix.target }}"
          TAG="${{ steps.vars.outputs.tag }}"
          STAGE_DIR="sandwich-${TAG}-${TARGET}"
          mkdir -p "${STAGE_DIR}/lib"

          # 1. Copy primary binaries renamed to sandwich-cli & sandwich-server
          cp build/bin/llama-cli "${STAGE_DIR}/sandwich-cli"
          cp build/bin/llama-server "${STAGE_DIR}/sandwich-server"

          # 2. Copy compiled shared libraries into lib/
          find build/bin -maxdepth 1 -name "*.so*" -exec cp -d {} "${STAGE_DIR}/lib/" \; 2>/dev/null || true

          # 3. For CUDA target: bundle CUDA runtime shared libraries into lib/
          if [ "${{ matrix.cuda }}" = "true" ]; then
            echo "Bundling CUDA runtime libraries into ${STAGE_DIR}/lib..."
            CUDA_ROOT="${CUDA_PATH:-/usr/local/cuda}"
            find "${CUDA_ROOT}" /usr/local/cuda* /usr/lib/x86_64-linux-gnu -name "libcudart.so*" -exec cp -d {} "${STAGE_DIR}/lib/" \; 2>/dev/null || true
            find "${CUDA_ROOT}" /usr/local/cuda* /usr/lib/x86_64-linux-gnu -name "libcublas.so*" -exec cp -d {} "${STAGE_DIR}/lib/" \; 2>/dev/null || true
            find "${CUDA_ROOT}" /usr/local/cuda* /usr/lib/x86_64-linux-gnu -name "libcublasLt.so*" -exec cp -d {} "${STAGE_DIR}/lib/" \; 2>/dev/null || true
          fi

          # 4. Patch RPATH to $ORIGIN/lib:$ORIGIN using patchelf
          patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' "${STAGE_DIR}/sandwich-cli" 2>/dev/null || true
          patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' "${STAGE_DIR}/sandwich-server" 2>/dev/null || true
          for so in "${STAGE_DIR}/lib"/*.so*; do
            if [ -f "$so" ] && [ ! -L "$so" ]; then
              patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
            fi
          done

          # 5. Include licenses, documentation, and client integration guide
          cp LICENSE "${STAGE_DIR}/" 2>/dev/null || true
          cp README.md "${STAGE_DIR}/" 2>/dev/null || true
          mkdir -p "${STAGE_DIR}/docs"
          cp docs/integrations.md "${STAGE_DIR}/docs/" 2>/dev/null || true

          # 6. Bundle unified CLI dispatcher wrapper script
          cp scripts/sandwich "${STAGE_DIR}/sandwich"
          chmod +x "${STAGE_DIR}/sandwich" "${STAGE_DIR}/sandwich-cli" "${STAGE_DIR}/sandwich-server"

          # 7. Create distribution tarballs
          mkdir -p dist
          TARBALL_VERSIONED="sandwich-${TAG}-${TARGET}.tar.gz"
          TARBALL_GENERIC="sandwich-${TARGET}.tar.gz"

          tar -czf "dist/${TARBALL_VERSIONED}" -C "${STAGE_DIR}" .
          cp "dist/${TARBALL_VERSIONED}" "dist/${TARBALL_GENERIC}"

          # 8. Generate checksums
          cd dist
          sha256sum "${TARBALL_VERSIONED}" "${TARBALL_GENERIC}" > "${TARGET}-checksums.sha256"
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release Draft
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.2.0-dev"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all matrix build artifacts
        uses: actions/download-artifact@v4
        with:
          path: download

      - name: Consolidate Release Tarballs & Compute Unified SHA256
        run: |
          mkdir -p release-assets
          find download -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.tar.gz > checksums.sha256
          echo "Unified Release SHA256 Checksums:"
          cat checksums.sha256
          cd ..

      - name: Publish Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "🥪 Sandwich.cpp ${{ steps.vars.outputs.tag }} (Standalone Ultra-Context Engine)"
          body: |
            ## 🥪 Sandwich.cpp ${{ steps.vars.outputs.tag }} Release

            High-throughput standalone binaries for sub-8GB ultra-context (128k) local LLM inference.

            ### 🚀 Core Engineering Innovations (52 Active Techniques)
            - **3-Tier Hierarchical MoE Engine (Technique #40):** HOT VRAM expert slab -> WARM DDR5 Transparent HugePages -> COLD NVMe `io_uring` direct DMA streaming.
            - **2Q & Ghost-Cache Replacement (Technique #41):** Two-queue probation and zero-weight metadata ghost cache eliminating transient expert thrashing on 120B models.
            - **70% RAM Rule & Asymmetric Split-KV (Technique #42):** Eliminates 15ms PCIe roundtrip sync bubbles on massive dense models (Command R 35B, Llama-3.3-70B) by pinning dense weights to CPU while reserving 100% of VRAM for FlashAttention and TurboQuant.
            - **TurboQuant Polar Lloyd-Max Quantization (Technique #9, #38):** 4-bit (`turbo4`) and 2-bit (`turbo2`) polar spherical KV cache compression enabling zero-decay 128k context on 8GB consumer GPUs.
            - **Radix-Tree Prefix Caching / RadixAttention (Technique #45):** Sub-0.05s TTFT on multi-turn agent turns via $O(L)$ prefix reuse.
            - **Frontier MoE & Hardware Kernels (Techniques #47–#52):** Dynamic MoE Softmax Entropy Pruning ($\tau_{\text{mass}}=0.96$), GPUDirect Storage NVMe bypass, Native MTP speculative rollout, Asymmetric KV outlier channelling, and Latent FlashMLA.

            ### 📦 Release Tarballs
            | Asset | Target Architecture | Hardware Acceleration |
            |:---|:---|:---|
            | `sandwich-${{ steps.vars.outputs.tag }}-linux-x86_64-cuda12.tar.gz` | Linux x86_64 | NVIDIA Ada, Hopper & Blackwell (Compute Capability 8.9, 9.0, 12.0) with bundled CUDA 12 runtime |
            | `sandwich-${{ steps.vars.outputs.tag }}-linux-x86_64-cpu.tar.gz` | Linux x86_64 | AVX2, FMA, and AVX-VNNI P-core vector acceleration |

            ### ⚡ One-Line Turnkey Installation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/sandeepmuttvarpu-png/Sandwich-cpp/main/install.sh | bash
            ```

            ### 🔌 Agent Server Deployment (Cursor, Continue.dev, OpenWebUI)
            ```bash
            sandwich-server -m /path/to/model.gguf --sandwich-auto --preset agent --port 8081
            ```
            See [`docs/integrations.md`](docs/integrations.md) for full configuration recipes.

            ### 🔒 Integrity Checksums
            All release tarballs and `checksums.sha256` are attached below.
          files: |
            release-assets/*.tar.gz
            release-assets/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
